name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript across Monorepo
        run: npm run typecheck

      - name: Run Vitest with 80%+ Domain Coverage
        run: npm run test:coverage

      - name: Build Web Dashboard Production Bundle
        run: npm --workspace=@lendstrangler/web run build
